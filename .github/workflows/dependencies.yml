name: Dependencies

# Weekly: are the Expo SDK packages on the patch versions this SDK expects? A failing run means
# "run npx expo install --fix" (on Node 24, see .nvmrc) and commit the result.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  expo-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx expo install --check
