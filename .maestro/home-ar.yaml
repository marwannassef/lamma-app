# Switching to Arabic restarts into RTL and the home screen renders in Arabic.
appId: com.anventureslabs.lamma
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: open-settings
- tapOn:
    id: lang-ar
# Switching to Arabic restarts the app to flip the layout; it comes back on Home.
- extendedWaitUntil:
    visible:
      id: app-title
    timeout: 60000
- tapOn:
    id: back
    optional: true
- assertVisible: 'لمّة'
- assertVisible: 'الجاسوس'
- tapOn:
    id: open-settings
- tapOn:
    id: lang-en
- extendedWaitUntil:
    visible: 'One phone. Everyone plays.'
    timeout: 60000
