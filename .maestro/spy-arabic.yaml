# The same two-round game in Arabic (RTL).
appId: com.anventureslabs.lamma
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: open-settings
- tapOn:
    id: lang-ar
# Switching to Arabic restarts the app to flip the layout; it comes back on Home.
- extendedWaitUntil:
    visible:
      id: app-title
    timeout: 60000
- tapOn:
    id: back
    optional: true
- runFlow:
    file: spy-two-rounds.yaml
    env:
      START_ROUND_3: 'ابدأ الجولة 3'
