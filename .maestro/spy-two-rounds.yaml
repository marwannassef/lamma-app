# 5 players play two Spy rounds; scores survive an app restart.
appId: com.anventureslabs.lamma
env:
  START_ROUND_3: ${START_ROUND_3 || 'Start round 3'}
---
- runFlow:
    when:
      true: ${!START_ROUND_3.startsWith('ابدأ')}
    commands:
      - runFlow: subflows/launch.yaml
- tapOn:
    id: game-spy
- scrollUntilVisible:
    element:
      id: level-off
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    speed: 80
    timeout: 90000
- tapOn:
    id: level-off
- runFlow:
    file: subflows/spy-round.yaml
- runFlow:
    file: subflows/spy-round.yaml
- scrollUntilVisible:
    element:
      id: change-settings
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    speed: 80
    timeout: 90000
- tapOn:
    id: change-settings
- assertVisible: ${START_ROUND_3}
- stopApp
- launchApp
- runFlow: subflows/open.yaml
- tapOn:
    id: game-spy
- assertVisible: ${START_ROUND_3}
