# With a development build (`-e DEV_URL=10.0.2.2:8081`), connect the launcher to Metro and skip the
# dev-tools intro. Store and preview builds have the app bundled, so this does nothing there.
appId: com.anventureslabs.lamma
---
- runFlow:
    when:
      true: ${typeof DEV_URL !== 'undefined' && DEV_URL !== ''}
    commands:
      # A cold start shows the launcher; a relaunch may go straight back into the app. Wait for
      # whichever comes first ("Lamma" / "لمّة" is on the launcher, the welcome screen and Home).
      - extendedWaitUntil:
          visible: '.*(Development Build|Lamma|لمّة|Who.s playing|parent PIN).*'
          timeout: 60000
# The launcher either lists Metro (found on the network) or shows an address box.
- runFlow:
    when:
      visible: 'New development server'
    commands:
      - tapOn: 'http://.*:8081'
- runFlow:
    when:
      visible: 'Connect'
    commands:
      - tapOn: 'http://'
      - inputText: ${DEV_URL}
      - hideKeyboard
      - tapOn: 'Connect'
# First connection: the dev menu shows an intro, then stays open. Hide its floating Tools button (it
# sits on top of Lamma's settings gear) and close the menu.
- runFlow:
    when:
      true: ${typeof DEV_URL !== 'undefined' && DEV_URL !== ''}
    commands:
      - extendedWaitUntil:
          visible: '.*(Continue|Runtime version|Who.s playing|parent PIN|One phone).*'
          timeout: 60000
          optional: true
      - tapOn:
          text: 'Continue'
          optional: true
      - runFlow:
          when:
            visible: 'Runtime version.*'
          commands:
            - scrollUntilVisible:
                element: 'Tools button'
                direction: DOWN
            - tapOn: 'Tools button'
            - pressKey: back
- extendedWaitUntil:
    visible:
      id: '(audience-teen|open-settings|pin-continue)'
    timeout: 60000
