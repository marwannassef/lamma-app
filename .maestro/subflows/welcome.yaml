# First launch: set the parent PIN (1234, twice), then choose Teens and adults, which asks for it.
# The 4th digit submits by itself.
appId: com.anventureslabs.lamma
---
- runFlow:
    when:
      visible:
        id: pin-continue
    commands:
      - tapOn:
          id: pin
      - inputText: '1234'
      - tapOn:
          id: pin
      - inputText: '1234'
- extendedWaitUntil:
    visible:
      id: '(audience-teen|open-settings)'
    timeout: 15000
- runFlow:
    when:
      visible:
        id: audience-teen
    commands:
      - tapOn:
          id: audience-teen
      - tapOn:
          id: pin
      - inputText: '1234'
