<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2E22"/><stop offset=".55" stop-color="#2F7A4E"/><stop offset="1" stop-color="#5B2DB8"/>
    </linearGradient>
    <radialGradient id="spot" cx="300" cy="230" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8FFB8" stop-opacity=".4"/><stop offset=".6" stop-color="#D8FFB8" stop-opacity=".07"/><stop offset="1" stop-color="#D8FFB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="400" cy="262" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6FFB0"/><stop offset="1" stop-color="#6DBE45"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="300" cy="230" r="230" fill="url(#spot)"/>
    <g transform="translate(256 262) scale(1.3) translate(-276 -292)">
    <g fill="#08160F">
      <!-- branch and leaves -->
      <path d="M-10 372 C120 352 300 346 530 318 L530 340 C300 368 120 376 -10 394 Z"/>
      <path d="M96 368 C80 330 92 300 120 286 C126 318 118 346 96 368 Z"/>
      <path d="M440 330 C470 300 500 300 520 312 C494 330 470 336 440 330 Z"/>
      <!-- body -->
      <path d="M170 300 C178 246 240 214 304 220 C336 223 356 234 372 250 L386 214
               C412 226 432 248 440 276 C444 292 436 304 420 308 C398 312 378 310 362 306
               C334 324 296 334 256 334 C222 334 190 324 170 300 Z"/>
      <!-- legs gripping the branch -->
      <path d="M330 318 C338 334 346 348 352 356 L372 356 L360 346 L352 324 Z"/>
      <path d="M220 326 C214 340 210 352 208 362 L228 364 L224 354 L236 330 Z"/>
    </g>
    <!-- curled tail -->
    <path d="M176 304 C140 304 116 328 118 356 C120 384 152 394 170 378 C184 366 178 346 162 348 C152 350 152 362 160 364"
          fill="none" stroke="#08160F" stroke-width="18" stroke-linecap="round"/>
    <!-- crest highlight -->
    <path d="M196 262 C230 230 280 220 330 228" fill="none" stroke="#6DBE45" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="404" cy="268" r="16" fill="#6DBE45"/>
    <circle cx="404" cy="268" r="16" fill="url(#eye)" fill-opacity=".9"/>
    <circle cx="408" cy="268" r="6" fill="#08160F"/>
    <circle cx="398" cy="262" r="3" fill="#FFFFFF" opacity=".9"/>
    </g>
  </g>
</svg>
