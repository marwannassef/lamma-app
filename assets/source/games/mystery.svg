<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12082A"/><stop offset=".6" stop-color="#3A1D6E"/><stop offset="1" stop-color="#7A2A86"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="250" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD58A" stop-opacity=".55"/><stop offset=".5" stop-color="#D23C82" stop-opacity=".14"/><stop offset="1" stop-color="#D23C82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DA"/><stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="250" r="190" fill="url(#glow)"/>
    <!-- light spilling down from the keyhole -->
    <path d="M232 300 L280 300 L360 512 L152 512 Z" fill="#FFD58A" opacity=".16"/>
    <!-- door plate -->
    <rect x="166" y="96" width="180" height="300" rx="90" fill="#0D0620"/>
    <rect x="166" y="96" width="180" height="300" rx="90" fill="none" stroke="#FFD58A" stroke-opacity=".35" stroke-width="3"/>
    <!-- glowing keyhole -->
    <circle cx="256" cy="210" r="40" fill="url(#light)"/>
    <path d="M238 236 L274 236 L290 320 L222 320 Z" fill="url(#light)"/>
    <!-- drifting question marks -->
    <g font-family="Georgia, serif" font-weight="700" fill="#FFFFFF">
      <text x="92" y="150" font-size="56" opacity=".35" transform="rotate(-14 92 150)">?</text>
      <text x="400" y="200" font-size="44" opacity=".28" transform="rotate(12 400 200)">?</text>
      <text x="380" y="420" font-size="36" opacity=".22" transform="rotate(-8 380 420)">?</text>
      <text x="84" y="380" font-size="40" opacity=".22" transform="rotate(10 84 380)">?</text>
    </g>
  </g>
</svg>
