      <!-- hat crown -->
      <path d="M170 246 C168 176 186 134 222 126 C238 136 274 136 290 126 C326 134 344 176 342 246 Z"/>
      <!-- hat brim -->
      <path d="M86 256 C120 228 190 222 256 222 C322 222 392 228 426 256 C390 270 322 274 256 274 C190 274 122 270 86 256 Z"/>
    </g>
