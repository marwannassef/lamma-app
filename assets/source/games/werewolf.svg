      <stop offset="0" stop-color="#0B0620"/><stop offset=".6" stop-color="#2A1259"/><stop offset="1" stop-color="#4B1E80"/>
    </linearGradient>
    <radialGradient id="halo" cx="300" cy="200" r="210" gradientUnits="userSpaceOnUse">
